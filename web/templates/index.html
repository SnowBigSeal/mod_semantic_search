<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mod Semantic Search</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>🔍 Mod Semantic Search</h1>
  <p>Natural language search across Modrinth mods</p>
</header>

<main>
  <!-- Search panel -->
  <section id="search-panel">
    <form id="search-form" onsubmit="doSearch(event)">
      <div class="form-row">
        <input
          type="text"
          id="query"
          name="query"
          placeholder="e.g. tech automation with power grids"
          autocomplete="off"
          required
        >
        <button type="submit" id="search-btn">Search</button>
      </div>
      <div class="form-row filters">
        <label>
          Loader
          <select id="loader">
            {% for l in loaders %}
            <option value="{{ l }}">{{ l }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Version
          <select id="version">
            {% for v in versions %}
            <option value="{{ v }}">{{ v }}</option>
            {% endfor %}
          </select>
        </label>
        <label>
          Results
          <select id="top">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </label>
      </div>
    </form>
  </section>

  <!-- Results -->
  <section id="results-section" hidden>
    <h2>Results <span id="results-meta"></span></h2>
    <div id="results-list"></div>
  </section>

  <!-- Error -->
  <div id="error-box" class="error-box" hidden></div>

  <!-- Status -->
  <section id="status-panel">
    <h2>Database Status</h2>
    <div id="status-content" class="status-grid">
      <div class="stat-card" id="stat-total"><span class="stat-label">Total mods</span><span class="stat-value">—</span></div>
      <div class="stat-card" id="stat-embedded"><span class="stat-label">Embedded</span><span class="stat-value">—</span></div>
      <div class="stat-card" id="stat-pending"><span class="stat-label">Pending</span><span class="stat-value">—</span></div>
      <div class="stat-card" id="stat-sync"><span class="stat-label">Last sync</span><span class="stat-value">—</span></div>
    </div>
    <div id="breakdown-table"></div>
  </section>
</main>

<script>
async function loadStatus() {
  try {
    const data = await (await fetch('/api/status')).json();
    document.querySelector('#stat-total .stat-value').textContent = data.total.toLocaleString();
    document.querySelector('#stat-embedded .stat-value').textContent = data.embedded.toLocaleString();
    document.querySelector('#stat-pending .stat-value').textContent = data.pending_embedding.toLocaleString();
    document.querySelector('#stat-sync .stat-value').textContent = data.last_sync ? data.last_sync.split('T')[0] : 'never';

    if (data.breakdown.length > 0) {
      const rows = data.breakdown.map(b =>
        `<tr><td>${b.loader}</td><td>${b.version}</td><td>${b.count.toLocaleString()}</td></tr>`
      ).join('');
      document.getElementById('breakdown-table').innerHTML =
        `<table><thead><tr><th>Loader</th><th>Version</th><th>Mods</th></tr></thead><tbody>${rows}</tbody></table>`;
    }
  } catch(e) {
    console.error('Failed to load status:', e);
  }
}

async function doSearch(e) {
  e.preventDefault();
  const query = document.getElementById('query').value.trim();
  const loader = document.getElementById('loader').value;
  const version = document.getElementById('version').value;
  const top = document.getElementById('top').value;

  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  btn.textContent = 'Searching…';

  document.getElementById('results-section').hidden = true;
  document.getElementById('error-box').hidden = true;

  try {
    const params = new URLSearchParams({ query, loader, version, top });
    const data = await (await fetch(`/api/search?${params}`)).json();

    if (data.error) {
      showError(data.error);
      return;
    }

    renderResults(data);
  } catch(e) {
    showError('Search failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Search';
  }
}

function renderResults(data) {
  const list = document.getElementById('results-list');
  const meta = document.getElementById('results-meta');

  meta.textContent = `(${data.results.length} of ${data.total_searched.toLocaleString()} mods)`;
  list.innerHTML = '';

  if (data.results.length === 0) {
    list.innerHTML = '<p class="no-results">No results found.</p>';
  } else {
    for (const r of data.results) {
      const card = document.createElement('div');
      card.className = 'mod-card';
      card.innerHTML = `
        <div class="mod-header">
          <span class="mod-rank">#${r.rank}</span>
          <a class="mod-title" href="${r.url}" target="_blank" rel="noopener">${escHtml(r.title)}</a>
          <span class="mod-side badge">${escHtml(r.side)}</span>
          <span class="mod-score badge">score ${r.score}</span>
        </div>
        <p class="mod-desc">${escHtml(r.description)}</p>
        <div class="mod-meta">
          <span>by ${escHtml(r.author)}</span>
          <span>⬇ ${r.downloads.toLocaleString()}</span>
        </div>
      `;
      list.appendChild(card);
    }
  }

  document.getElementById('results-section').hidden = false;
  document.getElementById('results-section').scrollIntoView({ behavior: 'smooth' });
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.hidden = false;
}

function escHtml(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadStatus();
</script>
</body>
</html>
